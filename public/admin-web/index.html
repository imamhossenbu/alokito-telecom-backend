<!DOCTYPE html>
<html lang="bn">
<head>
  <base href="/admin-web/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Alokito Telecom - Executive Admin Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alokito Telecom Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Alokito Telecom Admin</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0B131E;
      --card-bg: #FFFFFF;
      --primary: #0D5E36;
      --primary-light: #15803D;
      --shimmer-1: #E2E8F0;
      --shimmer-2: #F1F5F9;
      --shimmer-3: #CBD5E1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* Outer Wrapper for responsive web frame */
    #loading-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Header Bar */
    .skeleton-header {
      background: #FFFFFF;
      padding: 20px 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #E2E8F0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-pulse {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(13, 94, 54, 0.15);
      animation: pulseGlow 2s ease-in-out infinite;
      object-fit: contain;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(13, 94, 54, 0.3)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(21, 128, 61, 0.6)); }
    }

    .brand-text h1 {
      font-size: 19px;
      font-weight: 800;
      color: #0D5E36;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 12.5px;
      font-weight: 600;
      color: #64748B;
    }

    /* Shimmer Animation Effect */
    .shimmer {
      background: linear-gradient(
        90deg,
        #EDF2F7 0%,
        #F8FAFC 50%,
        #EDF2F7 100%
      );
      background-size: 200% 100%;
      animation: shimmerAnim 1.5s infinite ease-in-out;
      border-radius: 8px;
    }

    @keyframes shimmerAnim {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Content Area */
    .skeleton-content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    /* Top Stats Row Skeleton */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card-skeleton {
      background: #FFFFFF;
      border-radius: 14px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border: 1px solid #E2E8F0;
    }

    .stat-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .stat-num {
      width: 45px;
      height: 16px;
    }

    .stat-lbl {
      width: 60px;
      height: 10px;
    }

    /* Category Chips Skeleton */
    .categories-skeleton {
      display: flex;
      gap: 8px;
      padding: 4px 0;
      overflow: hidden;
    }

    .cat-chip {
      height: 34px;
      width: 75px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    /* Offer Cards Skeleton */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-skeleton {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header-sk {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-sk {
      width: 70px;
      height: 22px;
      border-radius: 6px;
    }

    .price-sk {
      width: 55px;
      height: 22px;
      border-radius: 6px;
    }

    .title-sk {
      width: 80%;
      height: 18px;
      border-radius: 4px;
    }

    .sub-sk {
      width: 50%;
      height: 12px;
      border-radius: 4px;
    }

    /* Bottom Loader Bar */
    .loading-footer {
      padding: 16px;
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #E2E8F0;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #0D5E36, #22C55E);
      border-radius: 4px;
      animation: progressAnim 1.8s infinite ease-in-out;
    }

    @keyframes progressAnim {
      0% { left: -40%; width: 40%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }

    .loading-text {
      font-size: 13px;
      font-weight: 700;
      color: #0D5E36;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner-dot {
      width: 8px;
      height: 8px;
      background: #15803D;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Loading Skeleton UI (Visible while Flutter Web JS initializes) -->
  <div id="loading-container">
    <!-- Top Bar -->
    <div class="skeleton-header">
      <div class="brand-group">
        <img src="favicon.png" alt="Logo" class="logo-pulse" onerror="this.style.display='none'">
        <div class="brand-text">
          <h1>আলোকিত টেলিকম</h1>
          <p>অ্যাডমিন কন্ট্রোল পোর্টাল</p>
        </div>
      </div>
      <div class="badge-sk shimmer" style="width: 36px; height: 36px; border-radius: 50%;"></div>
    </div>

    <!-- Middle Skeleton Body -->
    <div class="skeleton-content">
      <!-- 3 Stats Cards -->
      <div class="stats-row">
        <div class="stat-card-skeleton">
          <div class="stat-icon shimmer"></div>
          <div class="stat-num shimmer"></div>
          <div class="stat-lbl shimmer"></div>
        </div>
        <div class="stat-card-skeleton">
          <div class="stat-icon shimmer"></div>
          <div class="stat-num shimmer"></div>
          <div class="stat-lbl shimmer"></div>
        </div>
        <div class="stat-card-skeleton">
          <div class="stat-icon shimmer"></div>
          <div class="stat-num shimmer"></div>
          <div class="stat-lbl shimmer"></div>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div class="categories-skeleton">
        <div class="cat-chip shimmer" style="width: 60px; background: #0D5E36; opacity: 0.15;"></div>
        <div class="cat-chip shimmer"></div>
        <div class="cat-chip shimmer"></div>
        <div class="cat-chip shimmer"></div>
        <div class="cat-chip shimmer"></div>
      </div>

      <!-- Offer Cards List -->
      <div class="cards-list">
        <div class="card-skeleton">
          <div class="card-header-sk">
            <div class="badge-sk shimmer"></div>
            <div class="price-sk shimmer"></div>
          </div>
          <div class="title-sk shimmer"></div>
          <div class="sub-sk shimmer"></div>
        </div>

        <div class="card-skeleton">
          <div class="card-header-sk">
            <div class="badge-sk shimmer"></div>
            <div class="price-sk shimmer"></div>
          </div>
          <div class="title-sk shimmer"></div>
          <div class="sub-sk shimmer"></div>
        </div>

        <div class="card-skeleton">
          <div class="card-header-sk">
            <div class="badge-sk shimmer"></div>
            <div class="price-sk shimmer"></div>
          </div>
          <div class="title-sk shimmer"></div>
          <div class="sub-sk shimmer"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Loading Bar -->
    <div class="loading-footer">
      <div class="progress-bar">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="loading-text">
        <div class="spinner-dot"></div>
        <span>ড্যাশবোর্ড লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</span>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
